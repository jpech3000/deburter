async function autoBackup(data, todayStr) {
  try {
    if (isEmptyVal(data['a12:trainings']) && isEmptyVal(data['deburter:foodlog'])) return;
    const key = 'backup:' + todayStr;
    const ex = await api('/app_state?select=key&key=eq.' + encodeURIComponent(key));
    if (ex.ok && (await ex.json()).length) return;
    await api('/app_state', {
      method: 'POST',
      headers: {
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({
        key,
        value: {
          created: new Date().toISOString(),
          data
        },
        updated_at: new Date().toISOString()
      })
    });
    const lr = await api('/app_state?select=key&key=like.' + encodeURIComponent('backup:20*') + '&order=key.desc');
    if (!lr.ok) return;
    const old = (await lr.json()).map(r => r.key).slice(BACKUP_KEEP);
    for (const k of old) await api('/app_state?key=eq.' + encodeURIComponent(k), {
      method: 'DELETE'
    });
  } catch (e) {/* záloha nesmí shodit aplikaci */}
}
async function listBackups() {
  const r = await api('/app_state?select=key,updated_at&key=like.' + encodeURIComponent('backup*') + '&order=key.desc');
  if (!r.ok) throw new Error('list ' + r.status);
  return r.json();
}
async function restoreBackup(key, currentData) {
  const r = await api('/app_state?select=value&key=eq.' + encodeURIComponent(key));
  if (!r.ok) throw new Error('read ' + r.status);
  const rows = await r.json();
  if (!rows[0] || !rows[0].value || !rows[0].value.data) throw new Error('Záloha je prázdná');
  // Před obnovou ulož aktuální stav jako zálohu
  await api('/app_state', {
    method: 'POST',
    headers: {
      'Prefer': 'resolution=merge-duplicates,return=minimal'
    },
    body: JSON.stringify({
      key: 'backup-pred-obnovou:' + new Date().toISOString(),
      value: {
        created: new Date().toISOString(),
        data: currentData
      },
      updated_at: new Date().toISOString()
    })
  });
  const data = rows[0].value.data;
  for (const k of Object.keys(data)) {
    if (!DATA_KEYS.includes(k)) continue;
    const w = await api('/app_state', {
      method: 'POST',
      headers: {
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({
        key: k,
        value: data[k],
        updated_at: new Date().toISOString()
      })
    });
    if (!w.ok) throw new Error('restore ' + k + ' ' + w.status);
  }
}
async function exportBackupFile(data) {
  const json = JSON.stringify({
    exported: new Date().toISOString(),
    data
  }, null, 1);
  const name = 'deburter-zaloha-' + ymd(new Date()) + '.json';
  try {
    const file = new File([json], name, {
      type: 'application/json'
    });
    if (navigator.canShare && navigator.canShare({
      files: [file]
    })) {
      await navigator.share({
        files: [file],
        title: name
      });
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  const url = URL.createObjectURL(new Blob([json], {
    type: 'application/json'
  }));
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(url);
    a.remove();
  }, 1000);
}
